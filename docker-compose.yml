services:
  easyroc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${EASYROC_IMAGE:-ghcr.io/dncr/easyroc}:${EASYROC_IMAGE_TAG:-local}
    ports:
      - "${EASYROC_HOST_PORT:-3838}:3838"
    environment:
      SHINY_HOST: 0.0.0.0
      SHINY_PORT: 3838
      R_CONFIG_ACTIVE: ${R_CONFIG_ACTIVE:-staging}
      EASYROC_LOG_LEVEL: ${EASYROC_LOG_LEVEL:-INFO}
      EASYROC_LOG_FILE: ${EASYROC_LOG_FILE:-}
      EASYROC_HEALTHCHECK_HOST: 127.0.0.1
    healthcheck:
      test: ["CMD", "Rscript", "--vanilla", "scripts/healthcheck.R", "readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
